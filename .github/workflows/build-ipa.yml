name: Build unsigned IPA (iOS 16)

on:
  workflow_dispatch:
  push:
    branches: [ios16]

permissions:
  contents: read

jobs:
  queue-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Queue notice
        env:
          TG_TOKEN: ${{secrets.NANOMUSE_TG_TOKEN}
          TG_CHAT: ${{secrets.TG_CHAT_ID}
          RUN_URL: ${{github.server_url}/${{github.repository}/actions/runs/${{github.run_id}
          COMMIT: ${{github.sha}
        run: QUEUE=1 python3 notify.py

  build:
    needs: queue-notify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned
        run: |
          xcodebuild build \
            -project "Komari Mobile.xcodeproj" \
            -scheme "Komari Mobile" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Komari*.app" -path "*Release-iphoneos*" | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          SHORT=$(git rev-parse --short HEAD)
          ZIP="Komari-Mobile-ios16-unsigned-$SHORT.ipa"
          zip -qry "$ZIP" Payload
          echo "IPA=$ZIP" >> "$GITHUB_ENV"
          ls -la "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Komari-Mobile-ios16-unsigned
          path: ${{env.IPA}
          retention-days: 30

      - name: Notify NanoMuse
        if: always()
        env:
          TG_TOKEN: ${{secrets.NANOMUSE_TG_TOKEN}
          TG_CHAT: ${{secrets.TG_CHAT_ID}
          STATUS: ${{job.status}
          RUN_URL: ${{github.server_url}/${{github.repository}/actions/runs/${{github.run_id}
          COMMIT: ${{github.sha}
        run: |
          export IPA_FILE=${{env.IPA}
          python3 notify.py
